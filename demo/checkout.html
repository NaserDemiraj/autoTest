<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Demo Store - Checkout</title>
  <script src="/demo/scripts.js"></script>
</head>
<body>
  <h1>Checkout</h1>
  <form id="checkout-form">
    <label>First name <input id="firstName" data-test-id="first-name" /></label><br/>
    <label>Last name <input id="lastName" data-test-id="last-name" /></label><br/>
    <label>Email <input id="email" data-test-id="email" /></label><br/>
    <label>Address <input id="address" data-test-id="address" /></label><br/>
    <label>City <input id="city" data-test-id="city" /></label><br/>
    <label>Postal Code <input id="postal" data-test-id="postal" /></label><br/>
    <button type="button" data-test-id="confirm-order">Confirm Order</button>
  </form>
</body>
</html>
